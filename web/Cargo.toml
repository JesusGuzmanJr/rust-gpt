[package]
name = "web"
version = "0.1.0"

authors.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["native_db"]
native_db = ["common/native_db"]

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
axum = "0.8.6"
axum-extra = { version = "0.12.1", features = ["cookie"] }
axum-htmx = { version = "0.8.1", features = ["auto-vary"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
axum-valid = { version = "0.24.0", default-features = false, features = [
    "garde",
    "basic",
] }
base64 = "0.22.1"
blake3 = "1.8.2"
bytesize.workspace = true
check-if-email-exists = "0.9.1"
chrono = { workspace = true, features = ["serde"] }
chrono-tz = "0.10"
common = { path = "../common", features = ["native_db"] }
const_format.workspace = true
derive_more.workspace = true
garde = { version = "0.22.0", features = ["derive", "url", "email"] }
hex = "0.4.3"
icu = "2.0.0"
language_model = { path = "../language_model" }
lettre = { version = "0.11", default-features = false, features = [
    "pool",
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
    "tracing",
    "serde",
] }
mailchecker = "6.0.19"
maud = { version = "0.27.0", features = ["axum"] }
native_db.workspace = true
native_model = { version = "0.6.2", features = ["bincode_2"] }
quick_cache = "0.6.18"
rand = "0.9.2"
ron.workspace = true
rustls = { version = "0.23.34", features = ["ring"] }
serde.workspace = true
strum.workspace = true
thiserror.workspace = true
thousands.workspace = true
time = "0.3.44"
tokio.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = [
    "fs",
    "set-header",
    "timeout",
    "compression-full",
    "catch-panic",
] }
tower_governor = { version = "0.8.0", features = ["axum", "tracing"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wasm-bindgen = "0.2.93"
zeroize.workspace = true
zxcvbn = "3.1.0"

[build-dependencies]
oxc = { version = "0.96.0", features = ["full"] }
oxc_allocator = "0.96.0"
rsass = "0.29.2"
