[package]
name = "web"
version = "0.1.0"

authors.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8.6"
axum-extra = { version = "0.10.3", features = ["cookie"] }
axum-htmx = { version = "0.8.1", features = ["auto-vary"] }
axum-valid = { version = "0.24.0", default-features = false, features = ["garde", "basic"] }
bytesize.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
common = { path = "../common" }
const_format.workspace = true
derive_more.workspace = true
garde = { version = "0.22.0", features = ["derive", "url", "email"] }
icu = "2.0.0"
language_model = { path = "../language_model" }
maud = { version = "0.27.0", features = ["axum"] }
native_db = "0.8.2"
serde.workspace = true
strum.workspace = true
thiserror = "2.0.12"
thousands.workspace = true
tokio.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wasm-bindgen = "0.2.93"
zeroize.workspace = true
zxcvbn = "3.1.0"

[build-dependencies]
oxc = { version = "0.95.0", features = ["full"] }
oxc_allocator = "0.95.0"
rsass = "0.29.2"
