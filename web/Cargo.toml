[package]
name = "web"
version = "0.1.0"

authors.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# switch to a released version when https://github.com/vincent-herlemont/native_db/issues/357 is fixed
native_db = { git = "https://github.com/vincent-herlemont/native_db.git", branch = "main" }

anyhow.workspace = true
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
axum = "0.8.6"
axum-extra = { version = "0.10.3", features = ["cookie"] }
axum-htmx = { version = "0.8.1", features = ["auto-vary"] }
axum-valid = { version = "0.24.0", default-features = false, features = [
    "garde",
    "basic",
] }
base64 = "0.22.1"
blake3 = "1.8.2"
bytesize.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz = "0.10"
common = { path = "../common" }
const_format.workspace = true
derive_more.workspace = true
garde = { version = "0.22.0", features = ["derive", "url", "email"] }
icu = "2.0.0"
language_model = { path = "../language_model" }
maud = { version = "0.27.0", features = ["axum"] }
native_model = { version = "0.6.2", features = ["bincode_2"] }
rand = "0.9.2"
serde.workspace = true
strum.workspace = true
thiserror.workspace = true
thousands.workspace = true
time = "0.3.44"
tokio.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wasm-bindgen = "0.2.93"
zeroize.workspace = true
zxcvbn = "3.1.0"
tower_governor = { version = "0.8.0", features = ["axum", "tracing"] }

[build-dependencies]
oxc = { version = "0.95.0", features = ["full"] }
oxc_allocator = "0.95.0"
rsass = "0.29.2"
