[package]
name = "cuda-playground"
version = "0.1.0"
authors = ["Jesus Guzman, Jr. <jesusguzmanjr@icloud.com>"]
edition = "2024"
publish = false
repository = "https://github.com/MarzipanClub/cuda-playground"

# https://dev-doc.rust-lang.org/stable/rustc/lints/listing/index.html#lint-listing
[lints.rust]
let_underscore_drop = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_extern_crates = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[dependencies]


[build-dependencies]
cc = "1.2.39"
criterion = "0.7.0"

[[bench]]
name = "vec_add"
harness = false
