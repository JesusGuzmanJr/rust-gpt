[package]
authors = ["Jesus Guzman, Jr. <jesusguzmanjr@icloud.com>"]
edition = "2024"
name = "rust-gpt"
publish = false
repository = "https://github.com/MarzipanClub/rust-gpt"
version = "0.1.0"

# https://dev-doc.rust-lang.org/stable/rustc/lints/listing/index.html#lint-listing
[lints.rust]
let_underscore_drop = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
unreachable_pub = "warn"
unused_extern_crates = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
comrak = "0.42.0"
icu_normalizer = "2.0.0"
rayon = "1.11.0"
regex = "1.11.3"
smallvec = "1.15.1"
thousands = "0.2.0"
zstd = "0.13.3"

[dev-dependencies]
criterion = "0.7.0"

[build-dependencies]
cc = "1.2.39"

[[bench]]
harness = false
name = "kernels"
